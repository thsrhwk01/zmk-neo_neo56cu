name: Build Neo65 CU ZMK firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "boards/**"
      - "config/**"
      - "dts/**"
      - "src/**"
      - "tools/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
  push:
    branches:
      - "**"
    paths:
      - "boards/**"
      - "config/**"
      - "dts/**"
      - "src/**"
      - "tools/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c # v0.3.0

  audit-build:
    name: Build auditable ELF and metadata
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare isolated west workspace
        shell: sh
        run: |
          set -eu
          base_dir="$(mktemp -d)"
          build_dir="$(mktemp -d)"
          mkdir -p "${base_dir}/config"
          cp -R config/. "${base_dir}/config/"
          echo "base_dir=${base_dir}" >> "${GITHUB_ENV}"
          echo "build_dir=${build_dir}" >> "${GITHUB_ENV}"

      - name: Initialize pinned ZMK workspace
        working-directory: ${{ env.base_dir }}
        shell: sh
        run: |
          set -eu
          west init -l "${{ env.base_dir }}/config"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build Neo65 CU diagnostics image
        working-directory: ${{ env.base_dir }}
        shell: sh
        run: |
          set -eu
          west build -s zmk/app -d "${{ env.build_dir }}" -b neo65cu -- \
            -DZMK_CONFIG="${{ env.base_dir }}/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"

      - name: Audit linker, startup, clocks, memory, and ROM handoff
        shell: sh
        run: |
          set -eu
          python3 tools/audit-firmware.py \
            --bin "${{ env.build_dir }}/zephyr/zmk.bin" \
            --elf "${{ env.build_dir }}/zephyr/zmk.elf" \
            --map "${{ env.build_dir }}/zephyr/zmk.map" \
            --config "${{ env.build_dir }}/zephyr/.config" \
            --dts "${{ env.build_dir }}/zephyr/zephyr.dts"

      - name: Collect exact audited build outputs
        shell: sh
        run: |
          set -eu
          mkdir audit
          cp "${{ env.build_dir }}/zephyr/zmk.bin" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.elf" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.map" audit/
          cp "${{ env.build_dir }}/zephyr/.config" audit/
          cp "${{ env.build_dir }}/zephyr/zephyr.dts" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.stat" audit/
          arm-zephyr-eabi-readelf -W -h -S -l audit/zmk.elf > audit/readelf.txt
          arm-zephyr-eabi-nm -n -S --defined-only audit/zmk.elf > audit/symbols.txt
          arm-zephyr-eabi-objdump -d audit/zmk.elf > audit/disassembly.txt
          sha256sum audit/zmk.bin audit/zmk.elf > audit/SHA256SUMS

      - name: Upload auditable build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-neo65cu
          path: audit
          retention-days: 14

  verify:
    name: Verify exact release BIN
    needs:
      - build
      - audit-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout audit script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Download exact audited BIN
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-neo65cu
          path: artifacts/audit

      - name: Compare and validate release image
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit-firmware.py \
            --bin artifacts/firmware/neo65cu-zmk.bin \
            --expected-bin artifacts/audit/zmk.bin

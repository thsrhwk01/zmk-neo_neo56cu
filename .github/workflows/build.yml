name: Build and Release Neo65 CU ZMK firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "boards/**"
      - "config/**"
      - "dts/**"
      - "release/**"
      - "src/**"
      - "tools/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
  push:
    branches:
      - "**"
    tags:
      - "v*.*"
    paths:
      - "boards/**"
      - "config/**"
      - "dts/**"
      - "release/**"
      - "src/**"
      - "tools/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c # v0.3.0

  audit-build:
    name: Build auditable ELF and metadata
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare isolated west workspace
        shell: sh
        run: |
          set -eu
          base_dir="$(mktemp -d)"
          build_dir="$(mktemp -d)"
          mkdir -p "${base_dir}/config"
          cp -R config/. "${base_dir}/config/"
          echo "base_dir=${base_dir}" >> "${GITHUB_ENV}"
          echo "build_dir=${build_dir}" >> "${GITHUB_ENV}"

      - name: Initialize pinned ZMK workspace
        working-directory: ${{ env.base_dir }}
        shell: sh
        run: |
          set -eu
          west init -l "${{ env.base_dir }}/config"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build Neo65 CU diagnostics image
        working-directory: ${{ env.base_dir }}
        shell: sh
        run: |
          set -eu
          west build -s zmk/app -d "${{ env.build_dir }}" -b neo65cu -- \
            -DZMK_CONFIG="${{ env.base_dir }}/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"

      - name: Audit linker, startup, clocks, memory, and ROM handoff
        shell: sh
        run: |
          set -u
          status=0
          cmake_cache="${{ env.build_dir }}/CMakeCache.txt"
          readelf_tool="$(sed -n 's|^CMAKE_READELF:FILEPATH=||p' "${cmake_cache}")"
          nm_tool="$(sed -n 's|^CMAKE_NM:FILEPATH=||p' "${cmake_cache}")"
          objdump_tool="$(sed -n 's|^CMAKE_OBJDUMP:FILEPATH=||p' "${cmake_cache}")"
          test -x "${readelf_tool}"
          test -x "${nm_tool}"
          test -x "${objdump_tool}"
          echo "READELF_TOOL=${readelf_tool}" >> "${GITHUB_ENV}"
          echo "NM_TOOL=${nm_tool}" >> "${GITHUB_ENV}"
          echo "OBJDUMP_TOOL=${objdump_tool}" >> "${GITHUB_ENV}"
          python3 tools/audit-firmware.py \
            --bin "${{ env.build_dir }}/zephyr/zmk.bin" \
            --elf "${{ env.build_dir }}/zephyr/zmk.elf" \
            --map "${{ env.build_dir }}/zephyr/zmk.map" \
            --config "${{ env.build_dir }}/zephyr/.config" \
            --dts "${{ env.build_dir }}/zephyr/zephyr.dts" \
            --readelf "${readelf_tool}" \
            --nm "${nm_tool}" \
            --objdump "${objdump_tool}" \
            > audit-result.txt 2>&1 || status=$?
          cat audit-result.txt
          exit "${status}"

      - name: Collect exact audited build outputs
        if: always()
        shell: sh
        run: |
          set -eu
          mkdir -p audit
          cp "${{ env.build_dir }}/zephyr/zmk.bin" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.elf" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.map" audit/
          cp "${{ env.build_dir }}/zephyr/.config" audit/zephyr.config
          cp "${{ env.build_dir }}/zephyr/zephyr.dts" audit/
          cp "${{ env.build_dir }}/zephyr/zmk.stat" audit/
          cp audit-result.txt audit/
          "${READELF_TOOL}" -W -h -S -l audit/zmk.elf > audit/readelf.txt
          "${NM_TOOL}" -n -S --defined-only audit/zmk.elf > audit/symbols.txt
          "${OBJDUMP_TOOL}" -d audit/zmk.elf > audit/disassembly.txt
          sha256sum audit/zmk.bin audit/zmk.elf > audit/SHA256SUMS

      - name: Upload auditable build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-neo65cu
          path: audit
          retention-days: 14

  verify:
    name: Verify exact release BIN
    needs:
      - build
      - audit-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout audit script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Download exact audited BIN
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-neo65cu
          path: artifacts/audit

      - name: Compare and validate release image
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit-firmware.py \
            --bin artifacts/firmware/neo65cu-zmk.bin \
            --expected-bin artifacts/audit/zmk.bin

  package:
    name: Package hardware-validated Windows flasher
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out packaging files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: artifacts/firmware

      - name: Enforce hardware-validated release SHA-256
        shell: bash
        run: |
          set -euo pipefail
          firmware="artifacts/firmware/neo65cu-zmk.bin"
          manifest="release/neo65cu-zmk.sha256"

          python3 tools/audit-firmware.py --bin "${firmware}"

          if [[ "$(grep -cve '^[[:space:]]*$' "${manifest}")" -ne 1 ]]; then
            echo "::error file=${manifest},title=Release gate::Expected exactly one non-empty checksum line"
            exit 1
          fi

          read -r expected_hash expected_name < "${manifest}"
          if [[ ! "${expected_hash}" =~ ^[0-9a-f]{64}$ ]] || \
             [[ "${expected_name}" != "neo65cu-zmk.bin" ]]; then
            echo "::error file=${manifest},title=Release gate::Invalid verified-firmware manifest"
            exit 1
          fi

          actual_hash="$(sha256sum "${firmware}" | cut -d ' ' -f 1)"
          if [[ "${actual_hash}" != "${expected_hash}" ]]; then
            echo "::error file=${manifest},title=Release gate::Built BIN is not the hardware-validated image (expected ${expected_hash}, got ${actual_hash})"
            exit 1
          fi

          echo "Hardware-validated firmware SHA-256: ${actual_hash}"

      - name: Download verified dfu-util distribution
        shell: bash
        env:
          DFU_UTIL_BIN_SHA256: 6450de30a7dcd8d8c1273f43f0b153f054fd24d85f7f38296b1ad8edbd2ddb25
          DFU_UTIL_SRC_SHA256: b4b53ba21a82ef7e3d4c47df2952adf5fa494f499b6b0b57c58c5d04ae8ff19e
          LIBUSB_SRC_SHA256: 9c95417c6dfafa883798fa8f6a0f726581573952c2293fa7b6c4252f38afbc37
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 \
            --output dfu-util-0.11-binaries.tar.xz \
            https://downloads.sourceforge.net/project/dfu-util/dfu-util-0.11-binaries.tar.xz
          curl --location --fail --retry 3 \
            --output dfu-util-0.11.tar.gz \
            https://downloads.sourceforge.net/project/dfu-util/dfu-util-0.11.tar.gz
          curl --location --fail --retry 3 \
            --output libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz \
            https://codeload.github.com/libusb/libusb/tar.gz/1a906274a66dd58bf81836db1306902d4a7dc185
          echo "${DFU_UTIL_BIN_SHA256}  dfu-util-0.11-binaries.tar.xz" | sha256sum --check --strict
          echo "${DFU_UTIL_SRC_SHA256}  dfu-util-0.11.tar.gz" | sha256sum --check --strict
          echo "${LIBUSB_SRC_SHA256}  libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz" | sha256sum --check --strict
          tar -xJf dfu-util-0.11-binaries.tar.xz

      - name: Assemble Windows flasher bundle
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/NEO65CU-ZMK-Windows"
          third_party="${package_root}/third-party/dfu-util"
          validated_hash="$(cut -d ' ' -f 1 release/neo65cu-zmk.sha256)"
          mkdir -p "${third_party}"

          cp artifacts/firmware/neo65cu-zmk.bin "${package_root}/"
          cp tools/windows-flasher/flash-neo65cu.cmd "${package_root}/"
          cp tools/windows-flasher/flash-neo65cu.ps1 "${package_root}/"
          cp tools/windows-flasher/README_KO.txt "${package_root}/"
          cp tools/windows-flasher/THIRD-PARTY-NOTICES.txt "${package_root}/"
          cp LICENSE "${package_root}/LICENSE.txt"
          cp release/neo65cu-zmk.sha256 "${package_root}/HARDWARE-VALIDATED-SHA256.txt"
          cp dfu-util-0.11-binaries/win64/dfu-util.exe "${package_root}/"
          cp dfu-util-0.11-binaries/win64/libusb-1.0.dll "${package_root}/"
          cp dfu-util-0.11-binaries/COPYING "${third_party}/COPYING.txt"
          cp dfu-util-0.11-binaries/README-bin.txt "${third_party}/"
          cp dfu-util-0.11.tar.gz "${third_party}/"
          cp libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz "${third_party}/"

          printf 'Source commit: %s\nActions run: %s\nHardware validation: 2026-08-11\nHardware-validated SHA-256: %s\n' \
            "${GITHUB_SHA}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "${validated_hash}" \
            > "${package_root}/BUILD-INFO.txt"

          (
            cd "${package_root}"
            sha256sum \
              neo65cu-zmk.bin \
              dfu-util.exe \
              libusb-1.0.dll \
              HARDWARE-VALIDATED-SHA256.txt \
              > SHA256SUMS.txt
          )

      - name: Validate packaged Windows flasher
        shell: pwsh
        run: |
          & ./package/NEO65CU-ZMK-Windows/flash-neo65cu.ps1 -ValidateOnly

      - name: Upload Windows flasher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NEO65CU-ZMK-Windows
          path: package/NEO65CU-ZMK-Windows
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  release:
    name: Publish hardware-validated firmware release
    needs: package
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Windows flasher files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NEO65CU-ZMK-Windows
          path: flasher

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (
            cd flasher
            zip -9 -r ../release/NEO65CU-ZMK-Windows.zip .
          )
          cp flasher/neo65cu-zmk.bin release/
          (
            cd release
            sha256sum NEO65CU-ZMK-Windows.zip neo65cu-zmk.bin > SHA256SUMS.txt
          )

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${version}" =~ [a-zA-Z] ]]; then
            prerelease="true"
            make_latest="false"
          else
            prerelease="false"
            make_latest="true"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=Release ${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "make_latest=${make_latest}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            release/NEO65CU-ZMK-Windows.zip
            release/neo65cu-zmk.bin
            release/SHA256SUMS.txt
          body: |
            Hardware-validated wired ZMK firmware for the Qwertykeys Neo65 CU.

            Source commit: `${{ github.sha }}`

            Windows users can download `NEO65CU-ZMK-Windows.zip`, extract every
            file, and run `flash-neo65cu.cmd`. The flasher validates the exact
            firmware SHA-256 and STM32 ROM-DFU memory map, saves a 128 KiB
            pre-flash backup, writes only alt 0 at `0x08000000`, and verifies a
            post-flash readback.

            Never select alt 1 (Option Bytes) or use mass erase. Read the
            repository README before flashing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
